[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "模块化票据信息抽取 Agent：PDF 文本链路 + 图片视觉链路"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-agent = "invoice_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["invoice_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
